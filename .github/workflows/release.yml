name: release

# Every push to main packs the package and publishes the tarball to a GitHub
# Release tagged v<version> (the version from package.json). The artifact ships
# version-free as pkg.tgz and is ready to install without a lifecycle build.
# DSH installs can reference this release's tarball directly.
# Bump the version to cut a new release; re-pushing the same version refreshes
# that release's artifact.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install and build
        run: npm ci --legacy-peer-deps && npm run build
      - name: Pack the artifact
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          mv dist/*.tgz dist/pkg.tgz
      - name: Publish to the version release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tgz --clobber
          else
            gh release create "$tag" dist/*.tgz --title "$tag" --generate-notes
          fi
